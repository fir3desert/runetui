[package]
name = "runetui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Markdown and source-code viewer and editor for the terminal"
license = "MIT"
keywords = ["markdown", "tui", "ratatui", "syntect", "viewer"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "rtui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "7.0"
ignore = "0.4"
notify = "8.2"
portable-pty = "0.9"
pulldown-cmark = "0.13"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
thiserror = "2.0"
toml = "1.0"
unicode-width = "0.2"
vt100 = "0.16"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
